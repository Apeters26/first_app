name: Update breadth data

on:
  schedule:
    - cron: "30 22 * * 1-5" # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-breadth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_breadth.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/breadth.json
          git diff --cached --quiet && exit 0
          git commit -m "Update breadth data"
          git push
